name: Build media

# Regenerates the responsive image variants whenever a source photo changes.
#
# The point of this workflow: you can replace a photo entirely from the GitHub
# web interface, with no local Node install. Upload a file to
# site/assets/img/src/ and every size, format, the og.jpg card and the blurred
# placeholders are rebuilt and committed for you.
#
# No loop risk: the trigger watches only src/, and the commit touches the
# generated files outside it.

on:
  push:
    paths:
      - 'site/assets/img/src/**'
      - 'site/assets/video/src/**'
      - 'scripts/build-images.mjs'
      - 'scripts/build-picture.mjs'
      - 'scripts/build-clips.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate image variants
        run: npm run images

      - name: Generate looping clips
        run: npm run clips

      - name: Check the result is consistent
        run: |
          npm run test:images
          npm run test:clips

      - name: Commit the generated files
        run: |
          # index.html is included because the <picture> markup is generated
          # from the widths that were actually built — if it were left out, the
          # page could reference variants that no longer exist.
          PATHS="site/assets/img site/assets/video site/assets/css/placeholders.css site/index.html"

          if git diff --quiet -- $PATHS; then
            echo "Nothing changed — the variants were already up to date."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add $PATHS
          git commit -m "Rebuild image variants [skip ci]"
          git push

      - name: Summary
        run: |
          {
            echo "### Media rebuilt"
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            ls -la site/assets/img/*.avif 2>/dev/null | head -5 \
              | awk '{printf "| %s | %.0f kB |\n", $9, $5/1024}'
            echo ""
            echo "Deploy picks this up automatically."
          } >> "$GITHUB_STEP_SUMMARY"
